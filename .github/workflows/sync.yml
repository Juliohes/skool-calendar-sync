name: Sync Skool Calendar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar script de sincronizacion
        env:
          SKOOL_COOKIE: ${{ secrets.SKOOL_COOKIE }}
        run: python generate_calendar.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.ics
          git diff --staged --quiet || git commit -m "Sync calendar $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
